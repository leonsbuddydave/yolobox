name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test -v ./...

      - name: Run vet
        run: go vet ./...

  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Linux binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          LDFLAGS="-X main.Version=$VERSION"

          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o yolobox-linux-amd64 ./cmd/yolobox
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o yolobox-linux-arm64 ./cmd/yolobox

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-binaries
          path: yolobox-linux-*

  build-macos:
    name: Build macOS Binaries (Unsigned)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build macOS binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          LDFLAGS="-X main.Version=$VERSION"

          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o yolobox-darwin-amd64 ./cmd/yolobox
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o yolobox-darwin-arm64 ./cmd/yolobox

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-binaries
          path: yolobox-darwin-*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-binaries'
          merge-multiple: true

      - name: Create checksums
        run: |
          sha256sum yolobox-* > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yolobox-linux-amd64
            yolobox-linux-arm64
            yolobox-darwin-amd64
            yolobox-darwin-arm64
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            Fork release built from `feat/fork-shared-paths`.

            **macOS users:** the darwin binaries are unsigned. After downloading, run `xattr -d com.apple.quarantine yolobox-darwin-*` once before executing, or right-click → Open the first time.
